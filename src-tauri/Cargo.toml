[package]
name = "clavier-fulfulde-engine"
version = "1.0.0"
description = "Moteur de clavier Fulfulde natif & virtuel ultra-rapide"
authors = ["Fulfulde Developers"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = [ "window-minimize", "global-shortcut-all", "window-unmaximize", "window-hide", "notification-all", "window-start-dragging", "window-show", "window-maximize", "window-unminimize", "window-set-size", "window-set-position", "window-close", "window-set-always-on-top", "system-tray", "global-shortcut"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
tokio = { version = "1.38", features = ["full"] }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "libloaderapi", "minwindef", "windef", "winbase"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
